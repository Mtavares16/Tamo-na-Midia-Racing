// BUILD 09: sculpted coupe body using multiple curved cross sections rather than extruded boxes.
// X is front (-) to rear (+), Z is left/right, Y is height.
function sculptBody(parent,sections,mat,steps=10){
  const rings=[];
  for(let i=0;i<sections.length-1;i++){
    const a=sections[i],b=sections[i+1];
    for(let j=0;j<steps;j++){
      const t=j/steps, u=t*t*(3-2*t);
      rings.push(a.map((v,k)=>v+(b[k]-v)*u));
    }
  }
  rings.push(sections[sections.length-1]);
  const vertices=[],indices=[],N=20;
  for(const [x,base,shoulder,top,half] of rings){
    for(let k=0;k<N;k++){
      const a=k/N*Math.PI*2, c=Math.cos(a), sn=Math.sin(a);
      // Rounded shoulder and gently tapered roofline of the lower shell.
      const y=(base+top)/2+(top-base)/2*sn;
      const width=half*(.94+.06*Math.max(0,sn))*(1-.09*Math.max(0,sn));
      vertices.push(x,y,width*c);
    }
  }
  for(let i=0;i<rings.length-1;i++)for(let j=0;j<N;j++){
    const a=i*N+j,b=i*N+(j+1)%N,c=(i+1)*N+j,d=(i+1)*N+(j+1)%N;
    indices.push(a,c,b,b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(vertices,3));
  g.setIndex(indices);g.computeVertexNormals();
  return add(parent,g,mat,[0,0,0]);

makeDoor(-1);makeDoor(1);
// Bonnet and hatch are separate articulated pieces.
const hoodPivot=new THREE.Group();hoodPivot.position.set(-1.68,1.45,0);car.add(hoodPivot);add(hoodPivot,new THREE.BoxGeometry(1.0,.075,1.72),bodyMat,[-.48,0,0],[0,0,-.02]);
const trunkPivot=new THREE.Group();trunkPivot.position.set(1.72,1.5,0);car.add(trunkPivot);add(trunkPivot,new THREE.BoxGeometry(.75,.065,1.55),bodyMat,[.34,0,0],[0,0,.18]);

// Build 09: layered lighting lenses and silhouette highlights.
const headLights=[],tailLights=[];
const brightLens=new THREE.MeshStandardMaterial({color:0xd8f4ff,emissive:0x000000,emissiveIntensity:0.0,metalness:.25,roughness:.16});
const tailLens=new THREE.MeshStandardMaterial({color:0xb21927,emissive:0x250000,emissiveIntensity:.15,roughness:.18});
for(const side of [-1,1]){
 const z=side*.68;
 const head=add(car,new THREE.SphereGeometry(1,20,12),brightLens,[-2.14,1.30,z]);
 head.scale.set(.17,.085,.31);headLights.push(head);
 const tail=add(car,new THREE.SphereGeometry(1,20,12),tailLens,[2.13,1.50,side*.79]);
 tail.scale.set(.09,.31,.105);tail.rotation.z=-.30;tailLights.push(tail);
 // Lower window molding and side contour make the coupe silhouette more readable.
 add(car,new THREE.BoxGeometry(2.44,.022,.024),chrome,[.07,1.53,side*.82]);
 add(car,new THREE.BoxGeometry(2.85,.035,.03),trim,[.03,.96,side*.943]);
}
const headBeams=[];
for(const side of [-1,1]){
 const beam=new THREE.SpotLight(0xc9edff,0,9,Math.PI/8,.65,1.4);
 beam.position.set(-2.23,1.24,side*.65);
 const target=new THREE.Object3D();target.position.set(-8,.45,side*.65);
 car.add(beam,target);beam.target=target;headBeams.push(beam);
}
let lightsOn=false,spinning=false;
document.querySelector('#lightsBtn').onclick=()=>{
 lightsOn=!lightsOn;
 brightLens.emissive.setHex(lightsOn?0x9adfff:0);
 brightLens.emissiveIntensity=lightsOn?2:0;
 tailLens.emissive.setHex(lightsOn?0xe32833:0x250000);

 headBeams.forEach(l=>l.intensity=lightsOn?28:0);
 document.querySelector('#lightsBtn').classList.toggle('active',lightsOn);

};
document.querySelector('#spinBtn').onclick=()=>{
 spinning=!spinning;
 document.querySelector('#spinBtn').classList.toggle('active',spinning);

};
document.querySelector('#photoBtn').onclick=()=>{
 renderer.render(scene,camera);
 try{
 const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='Tamo-na-Midia-Build09.png';a.click();

 }catch(err){msg.textContent='O navegador bloqueou a captura. Use uma captura de tela do iPhone.'}
};
// Wheels: rubber sidewall, white multi-spoke face, brake disc and yellow caliper.
const wheels=[];const wheelWhite=new THREE.MeshStandardMaterial({color:0xe8e9e7,metalness:.72,roughness:.23});const wheelDark=new THREE.MeshStandardMaterial({color:0x343b42,metalness:.78,roughness:.24});function makeWheel(x,z){const g=new THREE.Group();g.position.set(x,.56,z);car.add(g);add(g,new THREE.TorusGeometry(.43,.12,16,48),rubber,[0,0,0]);add(g,new THREE.TorusGeometry(.295,.035,10,40),wheelWhite,[0,0,z>0?.018:-.018]);add(g,new THREE.CircleGeometry(.29,40),new THREE.MeshStandardMaterial({color:0x89939a,metalness:.8,roughness:.28,side:THREE.DoubleSide}),[0,0,z>0?.02:-.02]);
const spokeGroup=new THREE.Group();g.add(spokeGroup);for(let i=0;i<10;i++){const a=i*Math.PI/5;const spoke=add(spokeGroup,new THREE.BoxGeometry(.045,.49,.045),wheelWhite,[Math.sin(a)*.14,Math.cos(a)*.14,0],[0,0,-a]);spoke.userData.spokeIndex=i;}add(g,new THREE.CylinderGeometry(.085,.085,.035,24),chrome,[0,0,0],[Math.PI/2,0,0]);add(g,new THREE.BoxGeometry(.08,.2,.07),new THREE.MeshStandardMaterial({color:0xd6b23c,metalness:.35}),[.27,-.03,.03]);wheels.push({g,spokeGroup,x,z});}
for(const x of [-1.38,1.42])for(const z of [-.96,.96])makeWheel(x,z);
// Engine bay: conceptual transverse 2.0 16V assembly with removable engine group.
const engineGroup=new THREE.Group();engineGroup.position.set(-1.34,1.40,0);car.add(engineGroup);engineGroup.visible=false;
const engineMetal=new THREE.MeshStandardMaterial({color:0x555e65,metalness:.72,roughness:.34});
const engineBlack=new THREE.MeshStandardMaterial({color:0x171c21,metalness:.35,roughness:.48});
const engineRed=new THREE.MeshStandardMaterial({color:0x8d2630,metalness:.45,roughness:.3});
add(engineGroup,new THREE.BoxGeometry(.78,.34,.92),engineMetal,[0,0,0]);
add(engineGroup,new THREE.BoxGeometry(.72,.16,.78),engineBlack,[0,.23,0]);
add(engineGroup,new THREE.BoxGeometry(.56,.10,.62),engineRed,[0,.34,0]);
// Four coil/plug details across the 16-valve cover.
for(let i=0;i<4;i++){const z=-.27+i*.18;add(engineGroup,new THREE.CylinderGeometry(.035,.035,.13,12),engineBlack,[-.03,.44,z]);}
// Intake manifold, throttle body, alternator, battery and radiator.
add(engineGroup,new THREE.BoxGeometry(.34,.18,.62),engineMetal,[.32,.16,-.53]);
add(engineGroup,new THREE.CylinderGeometry(.10,.10,.18,20),engineBlack,[.43,.20,-.82],[Math.PI/2,0,0]);
add(engineGroup,new THREE.BoxGeometry(.30,.25,.27),engineBlack,[-.28,.05,.70]);
add(engineGroup,new THREE.BoxGeometry(.25,.23,.32),new THREE.MeshStandardMaterial({color:0x222a32}),[-.78,-.12,-.58]);
add(engineGroup,new THREE.BoxGeometry(.12,.16,.12),engineRed,[-.78,.08,-.58]);
const radiator=add(engineGroup,new THREE.BoxGeometry(.10,.48,1.24),engineMetal,[-.88,-.12,0]);
// A simple removable engine support cradle.
const engineMounts=[];for(const z of [-.38,.38])engineMounts.push(add(engineGroup,new THREE.BoxGeometry(.18,.10,.12),chrome,[.15,-.24,z]));
// Conceptual suspension: struts, springs and control arms at each wheel.
const suspensionParts=[];const springMat=new THREE.MeshStandardMaterial({color:0xe0ad45,metalness:.55,roughness:.3});
for(const x of [-1.38,1.42])for(const side of [-1,1]){
 const sg=new THREE.Group();sg.position.set(x,.60,side*.70);car.add(sg);
 add(sg,new THREE.CylinderGeometry(.055,.055,.58,16),engineMetal,[0,.12,0]);
 const spring=add(sg,new THREE.TorusGeometry(.105,.018,8,24),springMat,[0,.10,0]);spring.rotation.x=Math.PI/2;
 add(sg,new THREE.BoxGeometry(.42,.055,.08),engineMetal,[.05,-.22,side*.10],[0,0,side*.10]);
 sg.visible=false;suspensionParts.push(sg);
}
// Workshop lift: two posts, safety locks and four support arms.
const lift=new THREE.Group();scene.add(lift);
const liftYellow=new THREE.MeshStandardMaterial({color:0xd6a32e,metalness:.35,roughness:.42});
for(const z of [-1.65,1.65]){
 add(lift,new THREE.BoxGeometry(.18,2.2,.18),liftYellow,[-.15,1.05,z]);
 add(lift,new THREE.BoxGeometry(.24,.12,.24),engineBlack,[-.15,.10,z]);
 for(const x of [-.95,.95])add(lift,new THREE.BoxGeometry(.95,.08,.10),liftYellow,[x,.58,z*.78],[0,0,x<0?-.12:.12]);
}
const liftDeck=add(lift,new THREE.BoxGeometry(2.8,.08,.16),engineBlack,[0,.18,0]);
lift.visible=false;

// Mirrors, handles, roof antenna and twin exhausts.
for(const side of [-1,1]){add(car,new THREE.BoxGeometry(.22,.13,.2),trim,[-.72,1.55,side*.91]);add(car,new THREE.BoxGeometry(.15,.035,.03),chrome,[.55,1.12,side*.94]);}
add(car,new THREE.ConeGeometry(.035,.22,10),dark,[1.35,2.14,0],[0,0,-.2]);for(const z of [-.48,.48])add(car,new THREE.CylinderGeometry(.075,.075,.18,20),chrome,[2.2,.72,z],[Math.PI/2,0,0]);
// Wheel-arch rings subtly frame the tires.
for(const x of [-1.38,1.42])for(const side of [-1,1]){const arc=add(car,new THREE.TorusGeometry(.49,.035,8,36,Math.PI),trim,[x,.57,side*.93],[Math.PI/2,0,0]);arc.rotation.z=Math.PI;}
let liftRaised=false,engineRemoved=false,suspensionVisible=false;
const engineButton=document.querySelector('#engineBtn'),liftButton=document.querySelector('#liftBtn'),suspButton=document.querySelector('#suspBtn');
engineButton.onclick=()=>{engineRemoved=!engineRemoved;engineGroup.visible=hoodOpen&&!engineRemoved;engineButton.textContent=engineRemoved?'Instalar motor':'Retirar motor';msg.textContent=engineRemoved?'Motor 2.0 16V retirado do cofre.':'Motor 2.0 16V reinstalado no cofre.'};
liftButton.onclick=()=>{liftRaised=!liftRaised;car.position.y=liftRaised?1.05:0;lift.visible=liftRaised&&sceneState.current==='performance';liftButton.textContent=liftRaised?'Baixar elevador':'Subir elevador';msg.textContent=liftRaised?'Veículo elevado — inspeção inferior habilitada.':'Veículo apoiado no chão.'};
suspButton.onclick=()=>{suspensionVisible=!suspensionVisible;suspensionParts.forEach(p=>p.visible=suspensionVisible);suspButton.textContent=suspensionVisible?'Ocultar suspensão':'Mostrar suspensão';msg.textContent=suspensionVisible?'Componentes conceituais da suspensão exibidos.':'Suspensão recolhida visualmente.'};
function resize(){const w=stage.clientWidth,h=stage.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}new ResizeObserver(resize).observe(stage);resize();
let hoodOpen=false,trunkOpen=false,doorOpen=[false,false];document.querySelector('#hoodBtn').onclick=()=>{hoodOpen=!hoodOpen;hoodPivot.rotation.z=hoodOpen?-.82:0;engineGroup.visible=hoodOpen&&!engineRemoved;document.querySelector('#hoodBtn').textContent=hoodOpen?'Fechar capô':'Abrir capô';msg.textContent=hoodOpen?'Capô aberto — motor 2.0 16V e componentes do cofre visíveis.':'Capô fechado.'};
function toggleDoor(i){doorOpen[i]=!doorOpen[i];doors[i].pivot.rotation.y=doorOpen[i]?doors[i].side*.85:0;document.querySelector(i?'#rightBtn':'#leftBtn').textContent=(i?'Porta direita':'Porta esquerda')+(doorOpen[i]?' — fechar':'');msg.textContent='Porta '+(i?'direita':'esquerda')+(doorOpen[i]?' aberta.':' fechada.')};document.querySelector('#leftBtn').onclick=()=>toggleDoor(0);document.querySelector('#rightBtn').onclick=()=>toggleDoor(1);
document.querySelector('#trunkBtn').onclick=()=>{trunkOpen=!trunkOpen;trunkPivot.rotation.z=trunkOpen?.85:0;document.querySelector('#trunkBtn').textContent=trunkOpen?'Fechar porta-malas':'Abrir porta-malas';msg.textContent=trunkOpen?'Porta-malas aberta.':'Porta-malas fechada.'};
document.querySelector('#resetBtn').onclick=()=>{camera.position.set(3.7,2.75,3.9);controls.target.set(0,1.05,0);controls.update();msg.textContent='Câmera centralizada.'};
document.querySelector('#paint').onchange=e=>{bodyMat.color.set(e.target.value);document.querySelector('#colorName').textContent=e.target.options[e.target.selectedIndex].text};
document.querySelector('#rim').oninput=e=>{const n=+e.target.value;document.querySelector('#rimOut').textContent=n+'”';const r=.43+(n-18)*.012;wheels.forEach(w=>{w.g.scale.setScalar(r/.43)})};
document.querySelector('#ride').oninput=e=>{const v=+e.target.value;const y=.43+(v/100)*.32;wheels.forEach(w=>w.g.position.y=y);document.querySelector('#rideOut').textContent=v<18?'Muito baixa':v<42?'Baixa':v<70?'Média':'Alta'};
document.querySelector('#camber').oninput=e=>{const v=+e.target.value;document.querySelector('#camberOut').textContent=v+'°';wheels.forEach(w=>w.g.rotation.x=v*.012)};
document.querySelector('#zoom').oninput=e=>{const v=+e.target.value;document.querySelector('#zoomOut').textContent=v+'%';const dir=camera.position.clone().sub(controls.target).normalize();const dist=THREE.MathUtils.clamp(5.3*100/v,controls.minDistance,controls.maxDistance);camera.position.copy(controls.target).addScaledVector(dir,dist);controls.update()};
document.querySelector('#wheelStyle').onchange=e=>{const v=e.target.value;document.querySelector('#wheelOut').textContent=e.target.options[e.target.selectedIndex].text;const mat=v==='dark'?wheelDark:wheelWhite;wheels.forEach(w=>{w.spokeGroup.children.forEach(s=>{s.material=mat;s.visible=v!=='five'||s.userData.spokeIndex%2===0});w.g.children[1].material=mat})};
// Camera safety volume: the bay walls are at +/-4.85 and ceiling at 4.8.
// Keep the camera inside a smaller collision-safe box and looking at the car.
function protectCamera(){
  const limit=4.4;
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-limit,limit);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-limit,limit);
  camera.position.y=THREE.MathUtils.clamp(camera.position.y,1.15,4.35);
  camera.lookAt(controls.target);
}
// Studio life: practical overhead fixtures, shop signs, and workstations.
const signCanvas=document.createElement('canvas');signCanvas.width=1024;signCanvas.height=256;
const ctx=signCanvas.getContext('2d');ctx.fillStyle='#101820';ctx.fillRect(0,0,1024,256);
ctx.fillStyle='#f1f3f4';ctx.font='bold 82px Arial';ctx.textAlign='center';ctx.fillText('TAMO NA MÍDIA',512,115);
ctx.fillStyle='#f3b53e';ctx.font='bold 62px Arial';ctx.fillText('RACING GARAGE',512,204);
const signTexture=new THREE.CanvasTexture(signCanvas);
const signMat=new THREE.MeshBasicMaterial({map:signTexture,side:THREE.DoubleSide});
add(performanceShop,new THREE.PlaneGeometry(3.5,.87),signMat,[0,3.35,-4.68]);
add(customShop,new THREE.PlaneGeometry(3.5,.87),signMat,[0,3.55,-5.72]);
const steel=new THREE.MeshStandardMaterial({color:0x697680,metalness:.7,roughness:.3});

for(const g of [performanceShop,customShop]){
 for(const x of [-3.9,3.9]){
  add(g,new THREE.BoxGeometry(1.3,.10,.65),worktop,[x,1.10,-3.55]);
  for(const z of [-3.82,-3.28])for(const dx of [-.52,.52])add(g,new THREE.BoxGeometry(.07,1.05,.07),steel,[x+dx,.54,z]);
  for(let i=0;i<3;i++)add(g,new THREE.BoxGeometry(.35,.3,.4),redTool,[x-.42+i*.42,.87,-3.55]);
 }
}
// Bright linear fixtures make the shop readable on phone screens.
const fixture=new THREE.MeshBasicMaterial({color:0xf4faff});
for(const x of [-2.5,0,2.5])for(const z of [-2.8,0,2.8]){
 add(performanceShop,new THREE.BoxGeometry(.09,.035,1.8),fixture,[x,4.55,z]);
}
renderer.toneMappingExposure=1.32;
switchWorkshop('performance');
function animate(){requestAnimationFrame(animate);controls.update();if(spinning)car.rotation.y+=.004;protectCamera();renderer.render(scene,camera)}animate();
