<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TAMO NA MÍDIA RACING — IMERSÃO 02</title><style>*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#10151c;color:white;font:13px system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:13px;background:linear-gradient(#090e14df,#090e1400);pointer-events:none}#hud b{font-size:16px;font-style:italic}#hud em{color:#f33;font-style:normal}#goal{position:fixed;top:67px;left:12px;padding:10px;background:#0c131bd9;border:1px solid #ffffff26;border-radius:9px;max-width:215px;font-size:12px}#goal strong{color:#ffd274}#status{position:fixed;bottom:calc(145px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#0c131bd9;white-space:nowrap;max-width:90vw;text-overflow:ellipsis;overflow:hidden}#joy{position:fixed;left:24px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:118px;height:118px;border-radius:100%;border:2px solid #ffffff70;background:#202b3999;touch-action:none}#knob{position:absolute;left:37px;top:37px;width:42px;height:42px;border-radius:50%;background:#ffffff9e;border:2px solid white;pointer-events:none}#actions{position:fixed;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px}button{border:1px solid #ffffff55;border-radius:12px;padding:12px 13px;background:#15202ce8;color:white;font:inherit;font-weight:700;min-width:116px}button:active{background:#b32d2d}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#10151c;z-index:20}#err{position:fixed;top:35%;left:10%;right:10%;background:#500;padding:20px;display:none;z-index:25}@media(min-width:700px){#joy{width:140px;height:140px}#knob{left:49px;top:49px}#status{bottom:185px}}</style></head><body><div id="loading">PREPARANDO OFICINA IMERSIVA...</div><div id="err"></div><div id="hud"><b>TAMO NA MÍDIA <em>RACING</em><div style="font-size:10px;font-weight:400">REBORN 02 · IMERSÃO</div></b><span style="color:#ffd274;font-weight:700">R$ 125.430</span></div><div id="goal"><strong>OBJETIVO</strong><div id="mission">Caminhe até o carro na oficina</div><div style="color:#b5c0ca;margin-top:5px">Joystick: andar · Arraste: olhar</div></div><div id="status">Oficina — modo terceira pessoa</div><div id="joy"><div id="knob"></div></div><div id="actions"><button id="interact">✋ INTERAGIR</button><button id="view">👁 CÂMERA</button><button id="reset">⌂ REINICIAR</button></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script><script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b2028);scene.fog=new THREE.Fog(0x1b2028,28,64);
const camera=new THREE.PerspectiveCamera(69,innerWidth/innerHeight,.12,90);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.45;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const M=(c,metal=0,rough=.65)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});const concrete=M(0x777c81,.13,.48),dark=M(0x171c23,.35),black=M(0x0b1015,.2),red=M(0xa91f29,.35),silver=M(0xaab4be,.68,.27),glass=new THREE.MeshPhysicalMaterial({color:0x233544,metalness:.12,roughness:.14,transparent:true,opacity:.68}),yellow=M(0xf7bf39),white=M(0xe3e9ee),steel=M(0x515b63,.8,.3);

box(0,-.16,0,24,.3,30,concrete,false);for(let x=-12;x<=12;x+=2)strip(x,0,.018,30,steel);for(let z=-15;z<=15;z+=2)strip(0,z,24,.018,steel);
for(let x of [-12,12]){box(x,4,0,.3,8,30,dark);for(let z=-13;z<=13;z+=4){box(x-Math.sign(x)*.18,4,z,.12,8,.22,steel);box(x-Math.sign(x)*.25,3,z,.09,2.7,.09,white)}}box(0,4,-15,24,8,.25,dark);box(0,8,0,24,.28,30,steel);for(let x of [-11,-5,1,7,11])box(x,7.78,0,.14,.13,30,black);for(let z=-12;z<=12;z+=4)box(0,7.75,z,24,.16,.18,black);
// Two distinct bays with safe interior walking space
for(let x of [-7,5]){for(let z of [-6,5]){strip(x,z,7,.07);strip(x-3.5,z+4, .07,8);strip(x+3.5,z+4,.07,8)}for(let dx of [-2.25,2.25]){box(x+dx,2.25,-5,.48,4.5,.55,red);box(x+dx,.22,-5,1.2,.14,1.6,black);box(x+dx,.25,-3.3,.15,.17,3.2,steel)}}
for(let x of [-10,-6,-2,2,6,10]){for(let z of [-11,-5,1,7]){const led=new THREE.Mesh(new THREE.BoxGeometry(2.6,.045,.07),new THREE.MeshBasicMaterial({color:x<0?0xe8f7ff:0xffe7bf}));led.position.set(x,7.65,z);scene.add(led)}}
for(let x of [-10,-8,-6]){box(x,.9,-13.8,1.35,1.7,.75,red);for(let y of [.45,.8,1.15])box(x,y,-13.35,1.1,.045,.05,steel)}for(let z of [-11,-9,-7]){box(10.6,1.15,z,1.8,2.2,1.1,steel);for(let y of [.5,1.2,1.9])box(10.6,y,z+0.56,1.65,.07,.08,black)}
for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.TorusGeometry(.43,.15,8,18),black);t.rotation.y=Math.PI/2;t.position.set(10.6,.55+(i%3)*.95,5+Math.floor(i/3)*1.1);scene.add(t)}
// Glass-walled detailing room, rear mezzanine, entry opening
box(-6,5.35,-12,11,.17,5,steel);for(let x of [-11,-8,-5,-2])box(x,6.1,-9.5,.08,1.5,.1,steel);box(-6,6.8,-9.5,11,.08,.12,steel);for(let x of [-10,-7,-4])box(x,5.5,-9.5,2.7,1.35,.03,glass,false);
for(let z of [-14,-10,-6,-2,2,6]){box(-11.65,2.8,z,.06,3.4,.09,new THREE.MeshBasicMaterial({color:0xffe2b2}));box(-11.65,4.6,z,.06,.09,2.5,new THREE.MeshBasicMaterial({color:0xd9f5ff}))}
// Procedural temporary car, deliberately a test proxy (NOT faithful C4 geometry)
const car=new THREE.Group();scene.add(car);car.position.set(5,0,-5);function part(geo,mat,x,y,z){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.castShadow=true;car.add(o);return o}part(new THREE.BoxGeometry(1.95,.48,4.15),silver,0,.78,0);part(new THREE.BoxGeometry(1.72,.60,2.28),silver,0,1.28,-.20);part(new THREE.BoxGeometry(1.73,.43,1.9),glass,0,1.32,-.18);for(let x of [-.96,.96])for(let z of [-1.38,1.35]){const wheel=part(new THREE.CylinderGeometry(.42,.42,.22,24),black,x,.43,z);wheel.rotation.z=Math.PI/2;const hub=part(new THREE.CylinderGeometry(.26,.26,.235,12),white,x*1.01,.43,z);hub.rotation.z=Math.PI/2}for(let x of [-.67,.67]){part(new THREE.BoxGeometry(.33,.17,.06),white,x,.89,-2.09);part(new THREE.BoxGeometry(.30,.16,.06),red,x,.9,2.09)}
// Character avatar: camera follows from behind, physical floor movement.
const player=new THREE.Group();scene.add(player);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.29,.75,4,8),black);torso.position.y=1.14;player.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.23,12,10),M(0x98715a));head.position.y=1.94;player.add(head);const cap=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.14,12),black);cap.position.y=2.12;player.add(cap);for(let s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.2,.7,.25),dark);leg.position.set(s*.16,.36,0);player.add(leg)}player.position.set(0,0,8);
let yaw=0,pitch=.18,mode=0,carSpot=0,joystick={x:0,y:0},active=false,down=null,near=false,entered=false;const status=document.getElementById('status'),mission=document.getElementById('mission');function notify(s){status.textContent=s}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=r.width*.33,scale=Math.min(1,max/(len||1));joystick={x:dx*scale/max,y:dy*scale/max};knob.style.transform=`translate(${joystick.x*max}px,${joystick.y*max}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();active=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(active)moveJoy(e)});function stop(){active=false;joystick={x:0,y:0};knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down||down.id!==e.pointerId)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;yaw-=dx*.005;pitch=clamp(pitch+dy*.003,-.35,.65);down.x=e.clientX;down.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>down=null);renderer.domElement.addEventListener('pointercancel',()=>down=null);

document.getElementById('view').onclick=()=>{mode=(mode+1)%3;notify(['Câmera terceira pessoa','Câmera próxima / imersiva','Câmera panorâmica'][mode])};document.getElementById('reset').onclick=()=>{player.position.set(0,0,8);yaw=0;entered=false;car.position.set(5,0,-5);carSpot=0;mission.textContent='Caminhe até o carro na oficina';notify('Posição reiniciada')};document.getElementById('interact').onclick=()=>{if(!near){notify('Aproxime-se do veículo para interagir');return}if(!entered){entered=true;mission.textContent='Teste o posicionamento do carro';notify('Veículo selecionado — toque INTERAGIR para manobrar')}else{carSpot=(carSpot+1)%3;const positions=[[5,0,-5],[-7,0,-5],[0,0,4]];car.position.set(...positions[carSpot]);mission.textContent=['Carro no elevador mecânico','Carro na estética','Carro na garagem'][carSpot];notify(mission.textContent+' (posicionamento de teste)')}};
let last=performance.now();function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.045);last=t;let strafe=joystick.x,forward=-joystick.y;if(keys.has('w')||keys.has('arrowup'))forward=1;if(keys.has('s')||keys.has('arrowdown'))forward=-1;if(keys.has('a')||keys.has('arrowleft'))strafe=-1;if(keys.has('d')||keys.has('arrowright'))strafe=1;const len=Math.max(1,Math.hypot(strafe,forward)),speed=3.7;player.position.x=clamp(player.position.x+(Math.sin(yaw)*forward+Math.cos(yaw)*strafe)*speed*dt/len,-10.7,10.7);player.position.z=clamp(player.position.z+(-Math.cos(yaw)*forward+Math.sin(yaw)*strafe)*speed*dt/len,-13.5,13.4);player.rotation.y=yaw;near=player.position.distanceTo(car.position)<3.5;document.getElementById('interact').style.borderColor=near?'#ffd274':'#ffffff55';const focus=player.position.clone().add(new THREE.Vector3(0,1.55,0)),dist=[3.8,.25,7.2][mode],height=[1.35,.2,3.8][mode];const desired=focus.clone().add(new THREE.Vector3(-Math.sin(yaw)*dist,Math.sin(pitch)*dist+height,Math.cos(yaw)*dist));camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(focus.clone().add(new THREE.Vector3(Math.sin(yaw)*2,-pitch*2,-Math.cos(yaw)*2)));renderer.render(scene,camera)}requestAnimationFrame(tick);document.getElementById('loading').remove();notify('REBORN 02 — caminhe pela oficina');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>window.addEventListener('error',e=>{const x=document.getElementById('err');x.style.display='block';x.textContent='Falha ao carregar: '+e.message});window.addEventListener('unhandledrejection',e=>{const x=document.getElementById('err');x.style.display='block';x.textContent='Falha: '+e.reason})</script></body></html>
