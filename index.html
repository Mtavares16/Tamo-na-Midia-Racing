let running=false,liftHeight=0,liftTarget=0,walkPhase=0,moveBlend=0;let yaw=0,pitch=.18,mode=0,carSpot=0,joystick={x:0,y:0},active=false,down=null,near=false,entered=false;const status=document.getElementById('status'),mission=document.getElementById('mission');function notify(s){status.textContent=s}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
const joy=document.getElementById('joy'),knob=document.getElementById('knob');function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=r.width*.33,scale=Math.min(1,max/(len||1));joystick={x:dx*scale/max,y:dy*scale/max};knob.style.transform=`translate(${joystick.x*max}px,${joystick.y*max}px)`}joy.addEventListener('pointerdown',e=>{e.preventDefault();active=true;joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(active)moveJoy(e)});function stop(){active=false;joystick={x:0,y:0};knob.style.transform='translate(0,0)'}joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,id:e.pointerId};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down||down.id!==e.pointerId)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;yaw-=dx*.005;pitch=clamp(pitch+dy*.003,-.35,.65);down.x=e.clientX;down.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>down=null);renderer.domElement.addEventListener('pointercancel',()=>down=null);
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
document.getElementById('run').onclick=()=>{running=!running;document.getElementById('run').textContent='🏃 CORRER: '+(running?'ON':'OFF')};document.getElementById('lift').onclick=()=>{if(carSpot!==0){notify('Leve o carro para a área mecânica');return}liftTarget=liftTarget?0:1.35;if(liftTarget)document.getElementById('progress').innerHTML='✓ Explorar a oficina<br>✓ Inspecionar o carro<br>✓ Testar elevador';notify(liftTarget?'Elevador subindo':'Elevador descendo')};document.getElementById('view').onclick=()=>{mode=(mode+1)%3;notify(['Câmera terceira pessoa','Câmera próxima / imersiva','Câmera panorâmica'][mode])};document.getElementById('reset').onclick=()=>{player.position.set(0,0,8);yaw=0;entered=false;car.position.set(5,0,-5);carSpot=0;liftTarget=0;mission.textContent='Caminhe até o carro na oficina';notify('Posição reiniciada')};document.getElementById('interact').onclick=()=>{if(!near){notify('Aproxime-se do veículo para interagir');return}if(!entered){entered=true;mission.textContent='Inspecione as rodas e acione o elevador';document.getElementById('progress').innerHTML='✓ Explorar a oficina<br>✓ Inspecionar o carro<br>○ Testar elevador';notify('Veículo selecionado — toque INTERAGIR para manobrar')}else{carSpot=(carSpot+1)%3;const positions=[[5,0,-5],[-7,0,-5],[0,0,4]];car.position.set(...positions[carSpot]);mission.textContent=['Carro no elevador mecânico','Carro na estética','Carro na garagem'][carSpot];notify(mission.textContent+' (posicionamento de teste)')}};
let last=performance.now();function tick(t){requestAnimationFrame(tick);const dt=Math.min((t-last)/1000,.045);last=t;let strafe=joystick.x,forward=-joystick.y;if(keys.has('w')||keys.has('arrowup'))forward=1;if(keys.has('s')||keys.has('arrowdown'))forward=-1;if(keys.has('a')||keys.has('arrowleft'))strafe=-1;if(keys.has('d')||keys.has('arrowright'))strafe=1;const inputAmount=Math.min(1,Math.hypot(strafe,forward));moveBlend=THREE.MathUtils.lerp(moveBlend,inputAmount,Math.min(1,dt*9));walkPhase+=dt*(running?12:8)*moveBlend;legs.forEach((l,i)=>l.rotation.x=Math.sin(walkPhase+i*Math.PI)*.55*moveBlend);arms.forEach((a,i)=>a.rotation.x=-Math.sin(walkPhase+i*Math.PI)*.4*moveBlend);torso.rotation.z=Math.sin(walkPhase)*.035*moveBlend;const len=Math.max(1,Math.hypot(strafe,forward)),speed=running?6.1:3.3;player.position.x=clamp(player.position.x+(Math.sin(yaw)*forward+Math.cos(yaw)*strafe)*speed*dt/len,-10.7,10.7);player.position.z=clamp(player.position.z+(-Math.cos(yaw)*forward+Math.sin(yaw)*strafe)*speed*dt/len,-13.5,13.4);// Keep the player out of the solid test vehicle and lift posts.
const delta=player.position.clone().sub(car.position);if(delta.length()<1.45 && Math.abs(delta.y)<2){delta.y=0;delta.normalize();player.position.addScaledVector(delta,dt*speed*.8)}
player.rotation.y=yaw;liftHeight=THREE.MathUtils.lerp(liftHeight,liftTarget,Math.min(1,dt*1.4));car.position.y=liftHeight;near=player.position.distanceTo(car.position)<3.5;document.getElementById('mapdot').style.transform=`translate(${player.position.x*1.5}px,${player.position.z*1.5}px)`;document.getElementById('interact').style.borderColor=near?'#ffd274':'#ffffff55';const focus=player.position.clone().add(new THREE.Vector3(0,1.55,0)),dist=[3.8,.25,7.2][mode],height=[1.35,.2,3.8][mode];const desired=focus.clone().add(new THREE.Vector3(-Math.sin(yaw)*dist,Math.sin(pitch)*dist+height,Math.cos(yaw)*dist));camera.position.lerp(desired,Math.min(1,dt*7));camera.lookAt(focus.clone().add(new THREE.Vector3(Math.sin(yaw)*2,-pitch*2,-Math.cos(yaw)*2)));renderer.render(scene,camera)}requestAnimationFrame(tick);document.getElementById('loading').remove();notify('REBORN 04 — visual lab');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script><script>window.addEventListener('error',e=>{const x=document.getElementById('err');x.style.display='block';x.textContent='Falha ao carregar: '+e.message});window.addEventListener('unhandledrejection',e=>{const x=document.getElementById('err');x.style.display='block';x.textContent='Falha: '+e.reason})</script></body></html>
