import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';

box(0,-.12,0,27,.24,18,concrete);for(let x=-13;x<=13;x+=2){box(x,.012,0,.018,.02,18,mat(0x4a4f54))}for(let z=-8;z<=8;z+=2)box(0,.013,z,27,.02,.018,mat(0x4a4f54));box(-13.5,4,0,.32,8.1,18,dark);box(13.5,4,0,.32,8.1,18,dark);box(0,4,-9,27,8.1,.32,mat(0x34383d));box(0,8.1,0,27,.25,18,black);for(let x=-12;x<=12;x+=4){box(x,7.85,0,.15,.24,18,metal)}for(let z=-7;z<=7;z+=3.5)box(0,7.8,z,27,.17,.15,metal);for(let x of [-12.9,0,12.9])for(let z of [-8.6,0,8.6])box(x,4,z,.3,8,.3,metal);

box(-7,3.4,-8.7,12,6.5,.12,black);box(-12.9,3.4,-3,.08,6.5,11,black);for(let z=-7;z<=4;z+=2.1){lightBar(-12.5,3.2,z,3.8,true,z%4>0);lightBar(-1.1,3.2,z,3.8,true,z%4>0)}for(let z=-7;z<=4;z+=2.5){lightBar(-7,7.5,z,9);lightBar(-7,7.5,z+1,9,false,true)}for(let x of [-11,-3])for(let z of [-5,1]){line(x-1,z-2,x+1,z-2);line(x-1,z+2,x+1,z+2);line(x-1,z-2,x-1,z+2);line(x+1,z-2,x+1,z+2)}

function cabinet(x,z){box(x,.85,z,1.4,1.6,.6,red);for(let y of [.42,.75,1.08,1.42])box(x,y,z+.31,1.1,.04,.03,grey);for(let s of [-1,1])cyl(x+s*.48,.1,z,.10,.14,black)}for(let x of [1,6,11])cabinet(x,-7.9);for(let x of [3.5,7,10.5]){box(x,1.5,-8.4,2.4,2.9,.5,metal);for(let y of [.5,1.3,2.1])box(x,y,-8.05,2.25,.06,.55,grey)}for(let x of [4,5.1,6.2])for(let y of [.42,1.13]){const tire=new THREE.Mesh(new THREE.TorusGeometry(.48,.16,10,22),black);tire.position.set(x,y,5.9);tire.rotation.y=Math.PI/2;scene.add(tire)}box(10,.8,4.2,1.3,.16,.8,metal);box(10,1.5,4.2,.16,1.4,.16,red);const eng=box(10,1.6,4.2,.85,.65,.75,grey);for(let x of [9.7,10,10.3])cyl(x,2.05,4.2,.13,.18,black);

box(8,3.75,-7.1,9,.22,3.5,metal);for(let x of [3.6,12.4])box(x,1.9,-5.6,.18,3.8,.18,metal);for(let x=4;x<12.5;x+=.65)box(x,4.25,-5.45,.04,.8,.04,grey);box(8,4.62,-5.45,9,.06,.06,grey);box(8,5.6,-8.72,8,2.2,.12,glass);for(let i=0;i<9;i++){const step=box(3.7+i*.36,.18+i*.39,-4.8+i*.28,.82,.12,.33,grey);box(3.7+i*.36,.3+i*.39,-4.6+i*.28,.06,.5,.06,metal)}

box(7.3,7.7,8.8,11,.65,.6,metal);for(let x of [1.8,12.8])box(x,4.1,8.85,.5,8,.5,red);box(7.3,-.12,12,12,.12,6,concrete);for(let x of [4,7,10])line(x,9.2,x,14,mat(0xf6c52e));

function sign(label,x,y,z,w=5,h=1){const c=document.createElement('canvas');c.width=1024;c.height=220;const ctx=c.getContext('2d');ctx.clearRect(0,0,1024,220);ctx.fillStyle='#ffffff';ctx.font='italic 900 82px Arial';ctx.textAlign='center';ctx.fillText('TAMO NA MÍDIA',512,93);ctx.fillStyle='#ff3b45';ctx.font='italic 900 72px Arial';ctx.fillText('RACING',512,174);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide}));p.position.set(x,y,z);scene.add(p)}sign('',-7,3.6,-8.58,5,1.1);sign('',7.6,6,-8.48,4.5,1);

let liftUp=false,lightsOn=true,gateOpen=true,free=false,hidden=false;function focus(x,y,z,dist=11){controls.target.set(x,y,z);camera.position.set(x+dist*.7,y+dist*.58,z+dist*.72);controls.update()}const zones={oficina:[6,2,-1,11],estetica:[-7,2,-2,10],pecas:[9,2,-7,8],garagem:[0,3,0,19]};function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.style.display='none',2500)}document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');focus(...zones[b.dataset.zone]);toast('Área: '+b.textContent.trim())});function action(a){if(a==='elevador'){liftUp=!liftUp;lifts.forEach(g=>g.position.y=liftUp?1.7:0);toast(liftUp?'Elevadores erguidos':'Elevadores abaixados')}if(a==='luzes'){lightsOn=!lightsOn;hemi.intensity=lightsOn?2:.45;sun.intensity=lightsOn?2.3:.4;toast(lightsOn?'Luzes acesas':'Luzes reduzidas')}if(a==='portao'){gateOpen=!gateOpen;toast(gateOpen?'Portão aberto':'Portão fechado (simulação)')}if(a==='vista'){focus(0,2,0,19)}if(a==='livre'){free=!free;controls.maxDistance=free?45:29;toast(free?'Exploração livre ativada':'Exploração livre desativada')}}document.getElementById('panel').addEventListener('click',e=>{const b=e.target.closest('button');if(b)action(b.dataset.act)});document.getElementById('cam').onclick=()=>action('vista');document.getElementById('free').onclick=()=>action('livre');document.getElementById('ui').onclick=()=>{hidden=!hidden;document.getElementById('panel').style.display=hidden?'none':'flex';document.getElementById('hint').style.display=hidden?'none':'block';document.querySelector('header').style.display=hidden?'none':'flex';document.getElementById('ui').textContent=hidden?'👁 MOSTRAR UI':'👁 OCULTAR UI'};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateP
