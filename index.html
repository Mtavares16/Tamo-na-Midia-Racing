</style></head><body><div id="stage"><div id="world"></div><div id="reticle"></div></div><div id="hud"><div id="top"><div id="brand">TAMO NA MÍDIA <em>RACING</em></div><div id="money">R$ 125.430</div></div><div id="mission"><strong>◉ REBORN 05 — VISUAL TEST</strong><div>Prepare o carro para a inspeção</div><div id="tasks">○ Aproximar-se do carro<br>○ Inspecionar a roda<br>○ Finalizar serviço</div></div><div id="label">CÂMERA: <span id="mode">OFICINA</span></div><div id="hint">Arraste para olhar · Joystick para deslocar a câmera</div><div id="notice">Cenário fotográfico interativo · protótipo 2.5D</div><div id="controls"><div id="pad"><div id="nub"></div></div><div class="group"><button class="btn" id="walk">🚶 APROXIMAR</button><button class="btn" id="wheel">🔧 RODA</button><button class="btn" id="action">✋ INTERAGIR</button><button class="btn" id="reset">↺ VOLTAR</button></div></div><div id="panel"><h2 id="panelTitle"></h2><p id="panelText"></p><div class="small" id="panelDetail"></div><button class="btn" id="close">FECHAR</button></div><div id="toast"></div></div><script>
const world=document.getElementById('world'),panel=document.getElementById('panel'),mode=document.getElementById('mode'),tasks=document.getElementById('tasks'),hint=document.getElementById('hint');let zoom=1,dx=0,dy=0,step=0,inspect=false;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function draw(){world.style.transform=`translate(${dx}px,${dy}px) scale(${zoom})`;world.style.filter=inspect?'contrast(1.08) saturate(1.08)':'none'}function msg(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(msg.timer);msg.timer=setTimeout(()=>t.style.display='none',1700)}function update(){tasks.innerHTML=`${step>=1?'✓':'○'} Aproximar-se do carro<br>${step>=2?'✓':'○'} Inspecionar a roda<br>${step>=3?'✓':'○'} Finalizar serviço`;mode.textContent=inspect?'INSPEÇÃO':zoom>1.1?'PRÓXIMA':'OFICINA'}function approach(){zoom=1.55;dx=-innerWidth*.12;dy=innerHeight*.03;step=Math.max(step,1);inspect=false;hint.textContent='Agora inspecione a roda ou interaja com o serviço';draw();update()}function wheel(){zoom=2.55;dx=-innerWidth*.33;dy=innerHeight*.09;inspect=true;step=Math.max(step,2);hint.textContent='Inspeção da roda · toque em INTERAGIR';draw();update()}function interact(){if(step===0){approach();msg('Você se aproximou do veículo')}else if(step===1){wheel();msg('Inspeção iniciada')}else{step=3;update();openPanel('Serviço concluído','Inspeção visual registrada. A próxima etapa será substituir esta cena fotográfica por modelos 3D reais e animações de trabalho.','Esta demonstração não simula desmontagem, torque ou física do veículo.')}}function reset(){zoom=1;dx=0;dy=0;inspect=false;panel.style.display='none';hint.textContent='Arraste para olhar · Joystick para deslocar a câmera';draw();update()}function openPanel(t,b,d){document.getElementById('panelTitle').textContent=t;document.getElementById('panelText').textContent=b;document.getElementById('panelDetail').textContent=d;panel.style.display='block'}document.getElementById('walk').onclick=approach;document.getElementById('wheel').onclick=wheel;document.getElementById('action').onclick=interact;document.getElementById('reset').onclick=reset;document.getElementById('close').onclick=()=>panel.style.display='none';let drag=null;const stage=document.getElementById('stage');stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,dx,dy};stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(!drag)return;dx=clamp(drag.dx+(e.clientX-drag.x)*.55,-innerWidth*.55,innerWidth*.55);dy=clamp(drag.dy+(e.clientY-drag.y)*.45,-innerHeight*.45,innerHeight*.45);draw()});stage.addEventListener('pointerup',()=>drag=null);stage.addEventListener('pointercancel',()=>drag=null);stage.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom-e.deltaY*.002,1,3);draw()},{passive:false});const pad=document.getElementById('pad'),nub=document.getElementById('nub');let joy=null;pad.addEventListener('pointerdown',e=>{joy=e.pointerId;pad.setPointerCapture(e.pointerId)});pad.addEventListener('pointermove',e=>{if(joy!==e.pointerId)return;const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=clamp((e.clientX-cx)/36,-1,1),y=clamp((e.clientY-cy)/36,-1,1);nub.style.transform=`translate(${x*23}px,${y*23}px)`;dx=clamp(dx-x*10,-innerWidth*.55,innerWidth*.55);dy=clamp(dy-y*10,-innerHeight*.45,innerHeight*.45);draw()});function stop(){joy=null;nub.style.transform='translate(0,0)'}pad.addEventListener('pointerup',stop);pad.addEventListener('pointercancel',stop);window.addEventListener('resize',draw);update();draw();
</script></body></html>
